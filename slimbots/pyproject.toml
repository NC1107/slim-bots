[project]
name = "slim-m"
version = "0.3.0"
description = "A discord.py-shaped bot framework for slim-m: Bot, commands, ctx, a live Space model"
readme = "README.md"
requires-python = ">=3.9"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
keywords = ["slim-m", "bots", "chat"]

dependencies = ["websockets>=12", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/NC1107/slim-m"
Source = "https://github.com/NC1107/slim-bots"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["slimbots*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
