name: test

# Actions are pinned by commit SHA, not tag, so a compromised tag can't run arbitrary code here.
# Every third-party Python dependency installs from a hash-locked, wheel-only requirements file
# (regenerate with `pip-compile --generate-hashes`); the local slim-m checkout under test installs
# with --no-deps right after, since its own dependencies are already satisfied by that lock file.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  slimbots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install slimbots with its dev extras
        run: |
          python -m pip install --upgrade pip --only-binary=:all:
          python -m pip install --only-binary=:all: --require-hashes -r slimbots/requirements-ci.lock.txt
          python -m pip install --only-binary=:all: --no-deps -e "./slimbots[dev]"
      - name: Run the slimbots pytest suite
        working-directory: slimbots
        # These two repo-wide gates (see docs/framework.md's "Removed in 0.3.0") are only meant to
        # be fully green at the tip of the bot-porting PR stack; each PR before that still carries
        # a not-yet-ported template's old docstrings/imports, by design. Every other test gates here.
        run: python -m pytest -q --deselect tests/test_docstring_length.py::test_no_docstring_exceeds_two_lines --deselect tests/test_bot_import_hygiene.py::test_ported_bots_do_not_import_os_or_re
      - name: Report the two stack-wide gates (informational until the final PR in the stack)
        working-directory: slimbots
        continue-on-error: true
        run: python -m pytest -q tests/test_docstring_length.py tests/test_bot_import_hygiene.py

  bot-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install slimbots (local checkout) and every template's shared runtime dependencies
        run: |
          python -m pip install --upgrade pip --only-binary=:all:
          python -m pip install --only-binary=:all: --require-hashes -r bot-templates-requirements.lock.txt
          python -m pip install --only-binary=:all: --no-deps ./slimbots
      - name: Run every template's own test_bot.py, skipping one not yet ported onto Bot
        run: |
          set -e
          for dir in bot-*/; do
            bot="${dir%/}"
            if [ ! -f "$bot/test_bot.py" ]; then
              echo "skipping $bot: no test_bot.py (not on the Bot framework yet, or bot-ping, which stays library-free)"
              continue
            fi
            echo "::group::$bot"
            (cd "$bot" && python test_bot.py)
            echo "::endgroup::"
          done

  casino-concurrency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install slimbots (local checkout)
        run: |
          python -m pip install --upgrade pip --only-binary=:all:
          python -m pip install --only-binary=:all: --require-hashes -r bot-templates-requirements.lock.txt
          python -m pip install --only-binary=:all: --no-deps ./slimbots
      - name: Run bot-casino's real-thread, real-sqlite concurrency suite
        working-directory: bot-casino
        run: python test_concurrency.py
