name: test

# Actions are pinned by commit SHA, not tag, so a compromised tag can't run arbitrary code here.
# Every third-party Python dependency installs from a hash-locked, wheel-only requirements file
# (regenerate with `pip-compile --generate-hashes`). This repo's own slimbots package is never
# `pip install`ed here - there is no meaningful hash to pin a same-PR source checkout to, so it is
# just put on PYTHONPATH instead, which needs nothing from the checkout that --require-hashes could
# ever verify anyway.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/slimbots

jobs:
  slimbots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install slimbots' third-party dependencies (hash-locked, wheel-only)
        run: "python -m pip install --only-binary=:all: --require-hashes -r slimbots/requirements-ci.lock.txt"
      - name: Run the slimbots pytest suite
        working-directory: slimbots
        run: python -m pytest -q

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install slimbots' third-party dependencies, pyright included (hash-locked, wheel-only)
        run: "python -m pip install --only-binary=:all: --require-hashes -r slimbots/requirements-ci.lock.txt"
      - name: pyright over slimbots' public surface (basic mode, config in slimbots/pyproject.toml)
        working-directory: slimbots
        run: pyright

  bot-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install every template's shared runtime dependencies (hash-locked, wheel-only)
        run: "python -m pip install --only-binary=:all: --require-hashes -r bot-templates-requirements.lock.txt"
      - name: Run every template's own test_bot.py plus its other test_*.py files, skipping one not yet ported onto Bot
        # test_concurrency.py is deliberately excluded here - it has its own dedicated job below.
        run: |
          set -e
          for dir in bots/*/; do
            bot="${dir%/}"
            if [ ! -f "$bot/test_bot.py" ]; then
              echo "skipping $bot: no test_bot.py (not on the Bot framework yet, or bots/ping, which stays library-free)"
              continue
            fi
            echo "::group::$bot"
            (cd "$bot" && python test_bot.py)
            for extra in "$bot"/test_*.py; do
              name="$(basename "$extra")"
              if [ "$name" != "test_bot.py" ] && [ "$name" != "test_concurrency.py" ]; then
                (cd "$bot" && python "$name")
              fi
            done
            echo "::endgroup::"
          done

  casino-concurrency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install casino's shared runtime dependencies (hash-locked, wheel-only)
        run: "python -m pip install --only-binary=:all: --require-hashes -r bot-templates-requirements.lock.txt"
      - name: Run casino's real-thread, real-sqlite concurrency suite
        working-directory: bots/casino
        run: python test_concurrency.py

  voice-real-livekit:
    # Runs the jellyfin publish path against the real livekit package (the version the prod image
    # installs) and a real livekit-server (the version prod runs), since the fast suite only sees a fake.
    runs-on: ubuntu-latest
    services:
      livekit:
        image: livekit/livekit-server:v1.10.1@sha256:698a13999b4b2285866a32903724884b1e10c03259526391d9b3a72d9b73bbb4
        env:
          LIVEKIT_KEYS: "devkey: secret"
        ports:
          - 7880:7880
    env:
      LIVEKIT_URL: ws://127.0.0.1:7880
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install slimbots' dependencies plus the pinned real livekit (hash-locked, wheel-only)
        run: "python -m pip install --only-binary=:all: --require-hashes -r slimbots/requirements-livekit.lock.txt"
      - name: Run the real-livekit suite (surface, fake conformance, connect and publish)
        working-directory: slimbots
        run: python -m pytest -q tests_livekit

  bot-checklist:
    # Cheap structure gate for bot PRs; the rest of docs/shipping-a-bot.md is a human checklist.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pytest (hash-locked, wheel-only)
        run: "python -m pip install --only-binary=:all: --require-hashes -r slimbots/requirements-ci.lock.txt"
      - name: Test the checker and the smoke harness
        run: python -m pytest -q scripts/tests
      - name: Check the bots this PR changes
        if: github.event_name == 'pull_request'
        run: python scripts/check_bot_pr.py --base "origin/${{ github.base_ref }}"
